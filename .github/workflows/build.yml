name: Build

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: read


jobs:

  build-macos:
    name: macOS ${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            python-arch: x64

          - runner: macos-15
            arch: arm64
            python-arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python-arch }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and build dependencies
        run: python -m pip install -e ".[build]"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build macOS application
        run: python -m PyInstaller storage-unit-converter-macos.spec --clean --noconfirm

      - name: Build macOS CLI
        run: python -m PyInstaller storage-unit-converter-cli.spec --clean --noconfirm

      - name: Verify architecture
        run: |
          file "dist/Storage Unit Converter.app/Contents/MacOS/Storage Unit Converter"
          lipo -info "dist/Storage Unit Converter.app/Contents/MacOS/Storage Unit Converter"
          file "dist/suc"
          lipo -info "dist/suc"

      - name: Test standalone CLI
        run: |
          "dist/suc" --help
          "dist/suc" convert 100 GB GiB

      - name: Create distribution archive
        run: |
          mkdir -p "release/Storage Unit Converter"
          cp -R "dist/Storage Unit Converter.app" "release/Storage Unit Converter/"
          cp "dist/suc" "release/Storage Unit Converter/"
          ditto -c -k --sequesterRsrc --keepParent \
            "release/Storage Unit Converter" \
            "Storage-Unit-Converter-macOS-${{ matrix.arch }}.zip"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Storage-Unit-Converter-macOS-${{ matrix.arch }}
          path: Storage-Unit-Converter-macOS-${{ matrix.arch }}.zip
          retention-days: 14


  build-windows:
    name: Windows x86_64

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and build dependencies
        run: python -m pip install -e ".[build]"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows application
        run: python -m PyInstaller storage-unit-converter-windows.spec --clean --noconfirm

      - name: Build Windows CLI
        run: python -m PyInstaller storage-unit-converter-cli.spec --clean --noconfirm

      - name: Test standalone CLI
        shell: powershell
        run: |
          & "dist\suc.exe" --help
          & "dist\suc.exe" convert 100 GB GiB

      - name: Create distribution archive
        shell: powershell
        run: |
          Compress-Archive `
            -Path "dist\Storage Unit Converter.exe", "dist\suc.exe" `
            -DestinationPath "Storage-Unit-Converter-Windows-x86_64.zip"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Storage-Unit-Converter-Windows-x86_64
          path: Storage-Unit-Converter-Windows-x86_64.zip
          retention-days: 14

  build-linux:
    name: Linux x86_64
        
    runs-on: ubuntu-latest
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
        
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
        
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
        
      - name: Install project and build dependencies
        run: python -m pip install -e ".[build]"
        
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
        
      - name: Build Linux application
        run: python -m PyInstaller storage-unit-converter-linux.spec --clean --noconfirm

      - name: Build Linux CLI
        run: python -m PyInstaller storage-unit-converter-cli.spec --clean --noconfirm
        
      - name: Make executables executable
        run: |
          chmod +x "dist/Storage Unit Converter"
          chmod +x "dist/suc"
        
      - name: Test standalone CLI
        run: |
          "./dist/suc" --help
          "./dist/suc" convert 100 GB GiB

      - name: Create distribution archive
        run: |
          tar -czf Storage-Unit-Converter-Linux-x86_64.tar.gz \
            -C dist "Storage Unit Converter" "suc"
        
      - name: Create Debian package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            VERSION="1.1.0-dev"
          fi

          PACKAGE_ROOT="release/deb/storage-unit-converter_${VERSION}_amd64"

          mkdir -p "$PACKAGE_ROOT/DEBIAN"
          mkdir -p "$PACKAGE_ROOT/usr/bin"
          mkdir -p "$PACKAGE_ROOT/usr/share/applications"
          mkdir -p "$PACKAGE_ROOT/usr/share/pixmaps"

          cp "dist/Storage Unit Converter" \
            "$PACKAGE_ROOT/usr/bin/storage-unit-converter"

          cp "dist/suc" \
            "$PACKAGE_ROOT/usr/bin/suc"

          cp "packaging/linux/storage-unit-converter.desktop" \
            "$PACKAGE_ROOT/usr/share/applications/storage-unit-converter.desktop"

          cp "packaging/linux/storage-unit-converter.png" \
            "$PACKAGE_ROOT/usr/share/pixmaps/storage-unit-converter.png"

          chmod 755 "$PACKAGE_ROOT/usr/bin/storage-unit-converter"
          chmod 755 "$PACKAGE_ROOT/usr/bin/suc"
          chmod 644 "$PACKAGE_ROOT/usr/share/applications/storage-unit-converter.desktop"
          chmod 644 "$PACKAGE_ROOT/usr/share/pixmaps/storage-unit-converter.png"

          cat > "$PACKAGE_ROOT/DEBIAN/control" <<EOF
          Package: storage-unit-converter
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Aid3lito
          Description: Desktop storage unit converter
           Convert storage units between decimal and binary formats.
           Includes both a graphical interface and the suc command-line tool.
          EOF

          dpkg-deb --build \
            "$PACKAGE_ROOT" \
            "Storage-Unit-Converter-Linux-x86_64.deb"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Storage-Unit-Converter-Linux-x86_64
          path: |
            Storage-Unit-Converter-Linux-x86_64.tar.gz
            Storage-Unit-Converter-Linux-x86_64.deb
          retention-days: 14